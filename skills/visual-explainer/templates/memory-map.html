<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU Memory Map — Visual Explainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Blueprint aesthetic — dark navy */
    :root {
      --bg: #0a1628;
      --surface: #0d1f3c;
      --surface-raised: #102448;
      --border: #1e3a5f;
      --border-strong: #2e5a8f;
      --text: #c8d8e8;
      --text-dim: #7090b0;
      --accent: #4da6ff;
      --shadow: rgba(0,0,0,0.5);
      /* Memory region colors */
      --color-vectors:  #4d0000;
      --color-boot:     #003366;
      --color-app:      #3d1a4d;
      --color-cal:      #4d3300;
      --color-nvm:      #4d2d00;
      --color-stack:    #1a4d1a;
      --color-heap:     #336633;
      --color-bss:      #2a2a4d;
      --color-data:     #3d3d00;
      --color-shared:   #4d1a4d;
      --color-reserved: #1a1a2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    /* ─── Header ─── */
    .mm-header {
      max-width: 1200px;
      margin: 0 auto 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .mm-header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.375rem;
      font-weight: 500;
      color: var(--accent);
    }

    .mm-header .mcu-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: right;
    }

    /* ─── Main Layout ─── */
    .mm-layout {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 320px;
      gap: 2rem;
      align-items: start;
    }

    /* ─── Memory Bar ─── */
    .mm-bar-section {
      display: flex;
      flex-direction: column;
    }

    .mm-bar-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .mm-address-layout {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 0;
    }

    /* Address labels column */
    .mm-addresses {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-right: 0.5rem;
    }

    .mm-addr {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5rem;
      color: var(--text-dim);
      text-align: right;
    }

    /* The bar itself */
    .mm-bar {
      display: flex;
      flex-direction: column-reverse; /* address 0 at bottom */
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      overflow: hidden;
      height: 600px;
    }

    /* Region block */
    .mm-region {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: filter 0.15s;
      border-top: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .mm-region:hover { filter: brightness(1.3); }

    .mm-region-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5625rem;
      color: rgba(255,255,255,0.8);
      text-align: center;
      padding: 0.125rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    /* ASIL border on safety-critical regions */
    .mm-region.asil-d { border-left: 4px solid #ff2222; }
    .mm-region.asil-c { border-left: 4px solid #ff6600; }
    .mm-region.asil-b { border-left: 4px solid #ffcc00; }

    /* Overlap warning */
    .mm-region.overlap {
      outline: 2px solid #ff2222;
      outline-offset: -2px;
    }

    /* ─── Utilization Bar ─── */
    .mm-util {
      margin-top: 0.5rem;
    }

    .mm-util-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .mm-util-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .mm-util-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
      text-align: center;
    }

    /* ─── Sidebar: Region Table + Legend ─── */
    .mm-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .sidebar-title {
      padding: 0.625rem 1rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }

    .ve-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.6875rem;
    }

    .ve-table th {
      padding: 0.375rem 0.5rem;
      text-align: left;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5625rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      background: var(--surface-raised);
    }

    .ve-table td {
      padding: 0.375rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-dim);
    }

    .ve-table tr:last-child td { border-bottom: none; }
    .ve-table tbody tr:hover td { background: var(--surface-raised); }

    .region-swatch {
      display: inline-block;
      width: 0.625rem;
      height: 0.625rem;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 0.25rem;
    }

    /* ─── Tooltip ─── */
    .mm-tooltip {
      display: none;
      position: fixed;
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 0.75rem;
      min-width: 200px;
      z-index: 100;
      box-shadow: 0 4px 20px var(--shadow);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6875rem;
    }

    .mm-tooltip dt { color: var(--text-dim); margin-top: 0.25rem; }
    .mm-tooltip dd { color: var(--text); }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .mm-layout { grid-template-columns: 1fr 1fr; }
      .mm-sidebar { grid-column: 1 / -1; }
      body { padding: 1rem; }
    }
  </style>
</head>
<body>

  <header class="mm-header">
    <h1>MCU Memory Map</h1>
    <div class="mcu-meta">
      MCU: STM32F4xx &nbsp;|&nbsp; Flash: 512 KB &nbsp;|&nbsp; RAM: 128 KB
    </div>
  </header>

  <div class="mm-layout">

    <!-- FLASH Bar -->
    <div class="mm-bar-section">
      <div class="mm-bar-title">FLASH (512 KB)</div>
      <div class="mm-address-layout">
        <div class="mm-addresses" id="flash-addrs"></div>
        <div>
          <div class="mm-bar" id="flash-bar">
            <!-- Regions rendered by JS — address 0x0 at bottom -->
          </div>
          <div class="mm-util">
            <div class="mm-util-bar">
              <div class="mm-util-fill" id="flash-util-fill" style="background: var(--accent); width: 0%"></div>
            </div>
            <div class="mm-util-label" id="flash-util-label">0 / 512 KB (0%)</div>
          </div>
        </div>
      </div>
    </div>

    <!-- RAM Bar -->
    <div class="mm-bar-section">
      <div class="mm-bar-title">RAM (128 KB)</div>
      <div class="mm-address-layout">
        <div class="mm-addresses" id="ram-addrs"></div>
        <div>
          <div class="mm-bar" id="ram-bar">
            <!-- Regions rendered by JS -->
          </div>
          <div class="mm-util">
            <div class="mm-util-bar">
              <div class="mm-util-fill" id="ram-util-fill" style="background: var(--accent); width: 0%"></div>
            </div>
            <div class="mm-util-label" id="ram-util-label">0 / 128 KB (0%)</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="mm-sidebar">
      <div class="sidebar-panel">
        <div class="sidebar-title">Flash Regions</div>
        <table class="ve-table" id="flash-table">
          <thead><tr><th>Region</th><th>Start</th><th>Size</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="sidebar-panel">
        <div class="sidebar-title">RAM Regions</div>
        <table class="ve-table" id="ram-table">
          <thead><tr><th>Region</th><th>Start</th><th>Size</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Tooltip -->
  <div class="mm-tooltip" id="mm-tooltip">
    <dl id="tooltip-content"></dl>
  </div>

  <script>
    // ─── Region data — replace with linker script values ───
    const FLASH_BASE = 0x08000000;
    const RAM_BASE   = 0x20000000;
    const FLASH_SIZE = 512 * 1024; // 512 KB
    const RAM_SIZE   = 128 * 1024; // 128 KB

    const flashRegions = [
      // {name, offset (from base), size (bytes), color, asil}
      { name: 'Vectors',     offset: 0,           size: 0x200,   color: '#4d0000', asil: 'd', desc: 'Interrupt vector table' },
      { name: 'Bootloader',  offset: 0x200,        size: 0x8000,  color: '#003366', asil: 'b', desc: 'Primary bootloader' },
      { name: 'App Code',    offset: 0x8200,       size: 0x50000, color: '#3d1a4d', asil: 'd', desc: 'Main application firmware' },
      { name: 'Calibration', offset: 0x58200,      size: 0x8000,  color: '#4d3300', asil: '',  desc: 'Calibration parameters' },
      { name: 'NVM Emu.',    offset: 0x60200,      size: 0x1FE00, color: '#4d2d00', asil: '',  desc: 'EEPROM emulation area' },
    ];

    const ramRegions = [
      { name: 'Stack',    offset: 0x1F800, size: 0x800,  color: '#1a4d1a', asil: 'd', desc: 'Main stack (grows down)' },
      { name: 'Heap',     offset: 0x10000, size: 0xF800, color: '#336633', asil: '',  desc: 'Dynamic heap' },
      { name: 'BSS',      offset: 0x8000,  size: 0x8000, color: '#2a2a4d', asil: '',  desc: 'Zero-initialized static data' },
      { name: 'Data',     offset: 0x4000,  size: 0x4000, color: '#3d3d00', asil: '',  desc: 'Initialized static data' },
      { name: 'Reserved', offset: 0,       size: 0x4000, color: '#1a1a2e', asil: '',  desc: 'Reserved / unused' },
    ];

    function toHex(n) { return '0x' + n.toString(16).toUpperCase().padStart(8, '0'); }
    function toKB(n)   { return n >= 1024 ? (n / 1024).toFixed(n % 1024 === 0 ? 0 : 1) + ' KB' : n + ' B'; }

    function renderBar(barEl, tableEl, regions, totalSize, utilFill, utilLabel, base) {
      let usedBytes = 0;
      regions.forEach(r => { if (r.color !== '#1a1a2e') usedBytes += r.size; });

      // Sort by offset ascending (bottom = lowest address)
      const sorted = [...regions].sort((a, b) => a.offset - b.offset);

      sorted.forEach(r => {
        const heightPct = (r.size / totalSize) * 100;
        const block = document.createElement('div');
        block.className = 'mm-region' + (r.asil ? ' asil-' + r.asil : '');
        block.style.background = r.color;
        block.style.height = heightPct + '%';
        block.style.minHeight = heightPct < 2 ? '18px' : '0';
        block.title = r.name;

        const label = document.createElement('div');
        label.className = 'mm-region-label';
        label.textContent = r.name;
        block.appendChild(label);

        block.addEventListener('mousemove', (e) => {
          const tip = document.getElementById('mm-tooltip');
          tip.style.display = 'block';
          tip.style.left = (e.clientX + 14) + 'px';
          tip.style.top  = (e.clientY + 14) + 'px';
          document.getElementById('tooltip-content').innerHTML = `
            <dt>Region</dt><dd>${r.name}</dd>
            <dt>Start</dt><dd>${toHex(base + r.offset)}</dd>
            <dt>End</dt><dd>${toHex(base + r.offset + r.size - 1)}</dd>
            <dt>Size</dt><dd>${toHex(r.size)} (${toKB(r.size)})</dd>
            <dt>Access</dt><dd>${r.desc}</dd>
            ${r.asil ? `<dt>ASIL</dt><dd>ASIL-${r.asil.toUpperCase()}</dd>` : ''}
          `;
        });

        block.addEventListener('mouseleave', () => {
          document.getElementById('mm-tooltip').style.display = 'none';
        });

        barEl.appendChild(block);

        // Table row
        const row = tableEl.querySelector('tbody').insertRow();
        row.innerHTML = `
          <td><span class="region-swatch" style="background:${r.color}"></span>${r.name}</td>
          <td>${toHex(base + r.offset)}</td>
          <td>${toKB(r.size)}</td>
        `;
      });

      // Utilization
      const pct = Math.round((usedBytes / totalSize) * 100);
      utilFill.style.width = pct + '%';
      utilFill.style.background = pct > 90 ? '#7b0000' : pct > 75 ? '#806600' : '#4da6ff';
      utilLabel.textContent = `${toKB(usedBytes)} / ${toKB(totalSize)} (${pct}%)`;
    }

    renderBar(
      document.getElementById('flash-bar'),
      document.getElementById('flash-table'),
      flashRegions, FLASH_SIZE,
      document.getElementById('flash-util-fill'),
      document.getElementById('flash-util-label'),
      FLASH_BASE
    );

    renderBar(
      document.getElementById('ram-bar'),
      document.getElementById('ram-table'),
      ramRegions, RAM_SIZE,
      document.getElementById('ram-util-fill'),
      document.getElementById('ram-util-label'),
      RAM_BASE
    );
  </script>

</body>
</html>
